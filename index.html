<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driving License Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">Driving License Quiz</h1>
        <label class="progress-label">
          <span class="progress-text">Question</span>
          <input
            type="number"
            min="1"
            class="progress-input"
            id="question-jump"
            value="1"
            dir="ltr"
            aria-label="Jump to question number"
          />
          <span class="progress-of"
            >/ <span class="progress-total">0</span></span
          >
        </label>
      </header>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <main class="main">
        <article class="question-card" id="question-card">
          <p class="question-category" id="question-category"></p>
          <h2 class="question-text" id="question-text"></h2>
          <ul class="answers-list" id="answers-list" role="list"></ul>
        </article>

        <nav class="pagination" aria-label="Question navigation">
          <button
            type="button"
            class="btn btn-prev"
            id="btn-prev"
            aria-label="Previous question"
          >
            ← السابق
          </button>
          <button
            type="button"
            class="btn btn-next"
            id="btn-next"
            aria-label="Next question"
          >
            التالي →
          </button>
        </nav>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
